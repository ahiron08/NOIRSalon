services:
  # Optional local MongoDB — in production point MONGODB_URI at Atlas instead.
  mongo:
    image: mongo:7
    container_name: noir-mongo
    restart: unless-stopped
    volumes:
      - noir-mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 }).ok']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noir-web
    restart: unless-stopped
    ports:
      - '${PORT:-5000}:5000'
    environment:
      NODE_ENV: production
      PORT: '5000'
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/noir}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5000}
      API_URL: ${API_URL:-http://localhost:5000/api/v1}
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_long_random_secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_COOKIE_EXPIRES_IN: ${JWT_COOKIE_EXPIRES_IN:-7}
      ADMIN_NAME: ${ADMIN_NAME:-NOIR Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@noirsalon.in}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-cash}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-NOIR SALON <no-reply@noirsalon.in>}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      GOOGLE_MAP_EMBED: ${GOOGLE_MAP_EMBED:-}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
      INSTAGRAM_USERNAME: ${INSTAGRAM_USERNAME:-noir.salon}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - noir-uploads:/app/server/uploads

volumes:
  noir-mongo-data:
  noir-uploads: